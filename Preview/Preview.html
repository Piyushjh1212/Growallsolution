<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Preview | Premium Player Hub</title>

    <!-- External Fonts & Core Assets -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Architecture Files -->
    <link rel="stylesheet" href="./Preview.css">
    <link rel="stylesheet" href="../Header/Header.css" />

    <!-- JavaScript Infrastructure Layer (YouTube Iframe API asynchronous script injector foundation) -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config/supabase_config.js" defer></script>
    <script src="../Js_files/Header_script.js" defer></script>
    <script src="../Js_files/GlobalScroll.js"></script>
    <script src="./VideoEngine.js"></script>
</head>

<body class="vpp-body-terminal">

    <div id="header-placeholder"></div>

    <div class="vpp-player-container-root">
        <!-- Left Column: Video View Block Engine with Custom Overlays -->
        <div class="vpp-main-video-section">
            <div class="vpp-video-wrapper-frame" id="vpp-player-scope-window">

                <!-- 1. Hardcoded iframe ko hata kar sirf is target div ko rakhein (style="display:none" hata dein) -->
                <div id="videoPlayer"></div>

                <!-- Target element initialized by YouTube API Engine -->
                <div id="vpp-youtube-native-target"></div>

                <!-- Custom Overlay Controls Cluster Panel Box -->
                <div class="vpp-custom-controls-bar">
                    <div class="vpp-seekbar-wrapper">
                        <input type="range" class="vpp-seekbar" id="vpp-seekbar-node" min="0" max="100" value="0">
                    </div>
                    <div class="vpp-controls-row">
                        <div class="vpp-left-controls">
                            <button class="vpp-ctrl-btn" id="vpp-play-toggle"><i class="fa-solid fa-play"></i></button>
                            <button class="vpp-ctrl-btn" id="vpp-skip-backward"><i
                                    class="fa-solid fa-backward-step"></i></button>
                            <button class="vpp-ctrl-btn" id="vpp-skip-forward"><i
                                    class="fa-solid fa-forward-step"></i></button>

                            <div class="vpp-volume-block">
                                <button class="vpp-ctrl-btn" id="vpp-volume-icon"><i
                                        class="fa-solid fa-volume-high"></i></button>
                                <input type="range" class="vpp-volume-slider" id="vpp-volume-range" min="0" max="100"
                                    value="80">
                            </div>

                            <span class="vpp-time-stamp" id="vpp-time-metrics">00:00 / 00:00</span>
                        </div>

                        <div class="vpp-right-controls">
                            <!-- Quality Control Select Feature -->
                            <select class="vpp-select-dropdown" id="vpp-quality-node">
                                <option value="default" selected>Auto</option>
                                <option value="hd1080">1080p</option>
                                <option value="hd720">720p</option>
                                <option value="large">480p</option>
                                <option value="medium">360p</option>
                            </select>

                            <!-- Speed Controller -->
                            <select class="vpp-select-dropdown" id="vpp-speed-node">
                                <option value="0.5">0.5x</option>
                                <option value="1" selected>Normal</option>
                                <option value="1.5">1.5x</option>
                                <option value="2">2.0x</option>
                            </select>

                            <button id="vpp-fullscreen-toggle">
                                <i class="fa-solid fa-expand"></i>
                            </button>
                        </div>

                    </div>
                </div>

            </div>

            <h1 class="vpp-video-title-display" id="vpp-video-title">Loading Lecture...</h1>
            <!-- Remaining metadata logs stay static/untouched -->
            <div class="vpp-video-meta-row">
                <div class="vpp-instructor-info-block">
                    <img src="https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?q=80&w=100"
                        alt="Instructor Profile">
                    <div>
                        <h4>Vinod Kumar <i class="fa-solid fa-circle-check"
                                style="color: #3b82f6; font-size: 0.8rem;"></i></h4>
                        <span>1.2M Students Enrolled</span>
                    </div>
                </div>
            </div>
            <div class="vpp-description-box-card">
                <span id="vpp-video-tag"><i class="fa-solid fa-spinner fa-spin"></i> Processing</span>
                <p id="vpp-video-description">Fetching content...</p>
            </div>
        </div>

        <!-- Sidebar Playlist Wrapper Elements -->
        <div class="vpp-playlist-container-sidebar">
            <div class="vpp-playlist-header-node">
                <h3>Course Curriculum Preview</h3>
            </div>
            <div class="vpp-playlist-items-wrapper" id="vpp-playlist-container"></div>
        </div>
    </div>

    <!-- External Script Injection Hook Architecture -->
    <script src="./VideoEngine.js"></script>

    <script>
        fetch('../Header/Header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                if (window.initializeHeaderUi) {
                    window.initializeHeaderUi();
                }
            })
            .catch(error => console.error('Failed to load header:', error));
    </script>
</body>

</html>
